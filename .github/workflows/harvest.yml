name: harvest

# Reusable, called from a private repo that holds the review queue, the weekly schedule and the
# Langfuse read secrets. Redacted visitor questions must never land in this public repo.

on:
  workflow_call:
    inputs:
      evalgate_ref:
        description: "tag of evalgate to install"
        type: string
        required: true
    secrets:
      LANGFUSE_HOST:
        required: true
      LANGFUSE_READ_PUBLIC_KEY:
        required: true
      LANGFUSE_READ_SECRET_KEY:
        required: true

jobs:
  harvest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # the caller repo: review-queue/ is written here and used for dedupe
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: ramaraihan12/evalgate
          ref: ${{ inputs.evalgate_ref }}
          path: evalgate
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"

      - name: install evalgate
        working-directory: evalgate
        run: uv sync --locked --no-dev

      - name: Harvest flagged answers
        id: harvest
        env:
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
          LANGFUSE_READ_PUBLIC_KEY: ${{ secrets.LANGFUSE_READ_PUBLIC_KEY }}
          LANGFUSE_READ_SECRET_KEY: ${{ secrets.LANGFUSE_READ_SECRET_KEY }}
        run: evalgate/.venv/bin/evalgate harvest --out review-queue --github-output "$GITHUB_OUTPUT"

      - name: Open a pull request
        if: steps.harvest.outputs.rows != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WEEK: ${{ steps.harvest.outputs.week }}
          ROWS: ${{ steps.harvest.outputs.rows }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          branch="harvest/${WEEK}"
          if git ls-remote --exit-code --heads "$remote" "$branch" >/dev/null 2>&1; then
            branch="harvest/${WEEK}-${RUN_NUMBER}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base="$(git rev-parse --abbrev-ref HEAD)"
          git checkout -b "$branch"
          git add review-queue
          git commit -m "review queue ${WEEK}: ${ROWS} flagged answers"
          git push "$remote" "$branch"
          gh pr create --repo "$REPO" --base "$base" --head "$branch" \
            --title "review queue ${WEEK}" \
            --body "${ROWS} flagged answers from the last 7 days of production traces. Set label and expected on the rows worth keeping."

      - name: Nothing new
        if: steps.harvest.outputs.rows == '0'
        run: echo "no new rows this week, no pull request"
