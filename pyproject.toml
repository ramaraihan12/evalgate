[project]
name = "evalgate"
version = "0.2.0"
description = "A small eval gate for LLM apps: run known questions on a pull request and on its base, and compare."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
evalgate = "evalgate.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
